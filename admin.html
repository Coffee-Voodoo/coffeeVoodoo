    <!-- Login Section -->
    <section class="ftco-section" id="login-section">
      <div class="container mt-5">
        <div class="row justify-content-center">
          <div class="col-md-6 ftco-animate">
            <div class="heading-section text-center mb-5">
              <span class="subheading">Secure Access</span>
              <h2 class="mb-4">Admin Login</h2>
            </div>
            <form id="admin-login-form" class="contact-form" onsubmit="handleLogin(event)">
              <div class="form-group">
                <input type="text" id="admin-username" class="form-control" placeholder="Username" required>
              </div>
              <div class="form-group">
                <input type="password" id="admin-password" class="form-control" placeholder="Password" required>
              </div>
              <div class="form-group text-center mt-4">
                <button type="submit" class="btn btn-primary py-3 px-5">Login</button>
              </div>
              <p id="login-error" class="text-danger text-center" style="display: none;">Invalid credentials! (Use admin / admin123)</p>
            </form>
          </div>
        </div>
      </div>
    </section>

    <!-- Dashboard Section (Hidden by Default) -->
    <section class="ftco-section" id="admin-dashboard" style="display: none;">

        <div class="row mb-4 align-items-center">
          <div class="col-md-8">

          </div>

            <button class="btn btn-primary" onclick="openAddModal()">+ Add New Item</button>
            <button class="btn btn-secondary ml-2" onclick="handleLogout()">Logout</button>
          </div>
        </div>
        
        <div class="row">
          <div class="col-md-12 table-responsive">

                  <th>Name</th>
                  <th>Category</th>
                  <th>Price (₹)</th>
                  <th class="text-center">Actions</th>
                </tr>
              </thead>
              <tbody id="menu-table-body">
                <!-- Menu Items injected here by JS -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

    <!-- Add/Edit Modal -->
    <div class="modal fade" id="menuModal" tabindex="-1" role="dialog" aria-labelledby="menuModalLabel" aria-hidden="true">
      <div class="modal-dialog" role="document">
        <div class="modal-content bg-dark text-white" style="border: 1px solid #c49b63;">
          <div class="modal-header" style="border-bottom: 1px solid #c49b63;">
            <h5 class="modal-title" id="menuModalLabel" style="color: #c49b63;">Add/Edit Menu Item</h5>
            <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body">
            <form id="menu-item-form">
              <input type="hidden" id="item-id">
              <div class="form-group">
                <label>Item Name</label>
                <input type="text" class="form-control" id="item-name" style="background: transparent; color: #fff;" required>
              </div>
              <div class="form-group">
                <label>Price (₹)</label>
                <input type="number" class="form-control" id="item-price" style="background: transparent; color: #fff;" required>
              </div>
              <div class="form-group">
                <label>Description</label>
                <textarea class="form-control" id="item-desc" rows="3" style="background: transparent; color: #fff;" required></textarea>
              </div>
              <div class="form-group">
                <label>Category</label>
                <select class="form-control" id="item-category" style="background: #121212; color: #fff;">
                  <option>Coffee</option>
                  <option>Cold Coffee</option>
                  <option>Kombucha</option>
                  <option>Ice Tea & Shakes</option>
                  <option>Desserts</option>
                  <option>Bakery & Savouries</option>
                </select>
              </div>
            </form>
          </div>
          <div class="modal-footer" style="border-top: 1px solid #c49b63;">
            <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
            <button type="button" class="btn btn-primary" onclick="saveMenuItem()">Save changes</button>
          </div>
        </div>
      </div>
    </div>

      <div class="overlay"></div>
      <div class="container text-center">

        if (user === MOCK_USER && pass === MOCK_PASS) {

      if (!menuItems || menuItems.length < 50) {

        localStorage.setItem('cv_menu_items', JSON.stringify(menuItems));

      function renderTable() {
        const tbody = document.getElementById('menu-table-body');
        tbody.innerHTML = '';

        if(menuItems.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center">No menu items found.</td></tr>';
            return;
        }

        menuItems.forEach((item) => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${item.id}</td>
            <td><strong>${item.name}</strong><br><small class="text-muted">${item.desc}</small></td>
            <td>${item.category}</td>
            <td>₹${item.price}</td>
            <td class="text-center">
              <button class="btn btn-sm btn-outline-primary" onclick="openEditModal(${item.id})">Edit</button>
              <button class="btn btn-sm btn-outline-danger ml-1" onclick="deleteItem(${item.id})">Delete</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }

      function openAddModal() {
        document.getElementById('menu-item-form').reset();
        document.getElementById('item-id').value = '';
        $('#menuModal').modal('show');
      }

      function openEditModal(id) {
        const item = menuItems.find(i => i.id === id);
        if (item) {
          document.getElementById('item-id').value = item.id;
          document.getElementById('item-name').value = item.name;
          document.getElementById('item-price').value = item.price;
          document.getElementById('item-desc').value = item.desc;
          document.getElementById('item-category').value = item.category;
          $('#menuModal').modal('show');
        }
      }

      function saveMenuItem() {
        const idStr = document.getElementById('item-id').value;
        const name = document.getElementById('item-name').value;
        const price = document.getElementById('item-price').value;
        const desc = document.getElementById('item-desc').value;
        const category = document.getElementById('item-category').value;

        if(!name || !price) {
            alert("Name and Price are required!");
            return;
        }

        if (idStr) {
          // Edit existing
          const index = menuItems.findIndex(i => i.id === parseInt(idStr));
          if (index !== -1) {
            menuItems[index] = { id: parseInt(idStr), name, price: parseInt(price), desc, category };
          }
        } else {
          // Add new
          const newId = menuItems.length > 0 ? Math.max(...menuItems.map(i => i.id)) + 1 : 1;
          menuItems.push({ id: newId, name, price: parseInt(price), desc, category });
        }

        saveData();
        $('#menuModal').modal('hide');
        renderTable();
      }

      function deleteItem(id) {
        if (confirm('Are you sure you want to delete this item?')) {
          menuItems = menuItems.filter(i => i.id !== id);
          saveData();
          renderTable();
        }
      }

      function saveData() {
        localStorage.setItem('cv_menu_items', JSON.stringify(menuItems));
        // TODO: In a real app, you would make an API call (fetch/axios) to a backend database here.
      }
